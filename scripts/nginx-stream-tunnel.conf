# nginx 配置模板：隧道信令的 TLS 终结（stream 模块）
#
# 隧道的信令里带着房间令牌，所以**公网这一口必须是 TLS**。
# 做法：nginx 的 stream 模块终结 TLS，后面转给 broker 的**本机明文口**。
#
#   公网 8382/TCP (TLS) ──▶ nginx stream ──▶ 127.0.0.1:3479 (broker，明文，只在本机)
#   公网 3478/UDP       ──▶ broker 自己（STUN + TURN 中继，libjuice server 模式）
#
# 装法（需要 root）：
#   install -m 644 nginx-stream-tunnel.conf /etc/nginx/stream-a2.conf
#   # 在 /etc/nginx/nginx.conf 的顶层（events 之前）加一行：
#   #   include /etc/nginx/stream-a2.conf;
#   nginx -t && systemctl reload nginx
#
# 为什么要分两个口：
#   * broker 的明文口只绑 127.0.0.1 → 外面的人碰不到它；
#   * 公网只暴露 8382，而且是 TLS → 令牌不会裸奔；
#   * 8382 与 3478（STUN/TURN 的标准口）分开，扫描器不会把两者混为一谈。
#
# 侧载连法：
#   a2_tunnel --broker <host>:8382 --tls --ca-bundle <pem> ...

stream {
    server {
        listen 8382 ssl;
        listen [::]:8382 ssl;
        proxy_pass 127.0.0.1:3479;

        ssl_certificate     /etc/nginx/ssl/a2.crt;
        ssl_certificate_key /etc/nginx/ssl/a2.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # 信令连接是长连接（房间里的两台机器一直挂在上面）
        proxy_timeout 3600s;
        proxy_connect_timeout 5s;
    }
}
