# nginx 配置模板：给 VPS（或其他公网机器）上的 tea_a2 做 TLS 终结。
#
#   8383 (https) -> a2       127.0.0.1:8384
#
# （这台机器上只跑 a2，不跑 a2_task，所以没有 8283 那一段；
#   要跑队列的话，把 8283 的 server 段加回来：TLS 8283 -> 127.0.0.1:8284，
#   并且 a2_task 内部要监听 8284。）
#
# 装法（需要 root）：
#   mkdir -p /etc/nginx/ssl
#   openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
#     -keyout /etc/nginx/ssl/a2.key -out /etc/nginx/ssl/a2.crt \
#     -subj "/CN=<你的域名>" -addext "subjectAltName=DNS:<域名>,IP:<公网IP>"
#   chmod 600 /etc/nginx/ssl/a2.key && chmod 644 /etc/nginx/ssl/a2.crt
#   install -m 644 nginx-a2-tls.conf /etc/nginx/conf.d/a2-tls.conf
#   nginx -t && systemctl reload nginx
#
# 注意：a2 要腾出对外端口 8383，内部挪到 8384（仍然只绑 127.0.0.1）：
#   ~/.config/systemd/user/a2.service 里把 --port 8383 改成 --port 8384
#
# 内部两个服务只绑 127.0.0.1，外面只有 nginx 能到。
# 自签证书 → 客户端要显式信任（浏览器会警告，curl 要 -k 或装 CA）。
#
# Basic auth（两个 server 都开）：
#   # 1) 建口令文件（apr1 是 nginx 通用支持的格式；htpasswd -B 出的 bcrypt 也行）
#   printf 'ops:%s\n' "$(openssl passwd -apr1 '你的口令')" | sudo tee /etc/nginx/a2.htpasswd
#   sudo chmod 640 /etc/nginx/a2.htpasswd && sudo chown root:www-data /etc/nginx/a2.htpasswd
#   # 2) 下面两个 server 里已经有这两行：
#   #      auth_basic "tea_a2";
#   #      auth_basic_user_file /etc/nginx/a2.htpasswd;
#   # 3) 改口令：重跑第 1 步即可（不用重载 nginx 之外的任何东西）
#   # 客户端：浏览器弹框输入；curl 加 -u ops:口令
#   # SSE 不受影响（浏览器认证一次后每次请求都带上 Authorization 头）。
#
# tea_a2 on this VPS: nginx terminates TLS in front of the two local services.
#
#   8383 (https) -> a2       127.0.0.1:8384
#
# （这台机器上只跑 a2，不跑 a2_task，所以没有 8283 那一段；
#   要跑队列的话，把 8283 的 server 段加回来：TLS 8283 -> 127.0.0.1:8284，
#   并且 a2_task 内部要监听 8284。）
#
# The backends stay bound to 127.0.0.1: only nginx is reachable from outside.
# The certificate is self-signed (see /etc/nginx/ssl/a2.crt) — clients must
# trust it explicitly.

upstream a2_local {
    server 127.0.0.1:8384;
}

server {
    listen 8383 ssl;
    listen [::]:8383 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/a2.crt;
    ssl_certificate_key /etc/nginx/ssl/a2.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:a2ssl:10m;
    ssl_session_timeout 1h;

    # 谁能用这台机器上的 a2：口令（见文件头的说明）
    auth_basic "tea_a2";
    auth_basic_user_file /etc/nginx/a2.htpasswd;

    # 文件上传不设限（工作区的 shell upload 走的就是这个端口）
    client_max_body_size 0;
    server_tokens off;

    # SSE：对话是流式返回的，nginx 一缓冲就会攒到最后才出来。
    # （a2 自己也会发 X-Accel-Buffering: no，这里再关一道。）
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;

    location / {
        proxy_pass http://a2_local;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Buffering no;
    }
}
