# nginx 配置模板：给 VPS（或其他公网机器）上的 tea_a2 做 TLS 终结。
#
#   9393 (https) -> a2       127.0.0.1:8383
#   8283 (https) -> a2_task  127.0.0.1:8284
#
# 装法（需要 root）：
#   mkdir -p /etc/nginx/ssl
#   openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
#     -keyout /etc/nginx/ssl/a2.key -out /etc/nginx/ssl/a2.crt \
#     -subj "/CN=<你的域名>" -addext "subjectAltName=DNS:<域名>,IP:<公网IP>"
#   chmod 600 /etc/nginx/ssl/a2.key && chmod 644 /etc/nginx/ssl/a2.crt
#   install -m 644 nginx-a2-tls.conf /etc/nginx/conf.d/a2-tls.conf
#   nginx -t && systemctl reload nginx
#
# 注意：a2_task 要腾出 8283（nginx 用它对外），内部改到 8284：
#   ~/.config/systemd/user/a2_task.service 里把 --port 8283 改成 --port 8284
#
# 内部两个服务只绑 127.0.0.1，外面只有 nginx 能到。
# 自签证书 → 客户端要显式信任（浏览器会警告，curl 要 -k 或装 CA）。
#
# tea_a2 on this VPS: nginx terminates TLS in front of the two local services.
#
#   9393 (https) -> a2       127.0.0.1:8383
#   8283 (https) -> a2_task  127.0.0.1:8284
#
# The backends stay bound to 127.0.0.1: only nginx is reachable from outside.
# The certificate is self-signed (see /etc/nginx/ssl/a2.crt) — clients must
# trust it explicitly.

upstream a2_local {
    server 127.0.0.1:8383;
}

upstream a2_task_local {
    server 127.0.0.1:8284;
}

server {
    listen 9393 ssl;
    listen [::]:9393 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/a2.crt;
    ssl_certificate_key /etc/nginx/ssl/a2.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:a2ssl:10m;
    ssl_session_timeout 1h;

    # 文件上传不设限（工作区的 shell upload 走的就是这个端口）
    client_max_body_size 0;
    server_tokens off;

    # SSE：对话是流式返回的，nginx 一缓冲就会攒到最后才出来。
    # （a2 自己也会发 X-Accel-Buffering: no，这里再关一道。）
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;

    location / {
        proxy_pass http://a2_local;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Buffering no;
    }
}

server {
    listen 8283 ssl;
    listen [::]:8283 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/a2.crt;
    ssl_certificate_key /etc/nginx/ssl/a2.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:a2ssl:10m;
    ssl_session_timeout 1h;

    client_max_body_size 0;
    server_tokens off;

    # /api/events 也是 SSE
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;

    location / {
        proxy_pass http://a2_task_local;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Buffering no;
    }
}
