<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务队列 · tea_a2</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --panel2: #21252d; --line: #2c313a;
    --fg: #e7eaee; --dim: #9aa3ae; --faint: #6b7480;
    --ok: #3fb950; --warn: #d29922; --err: #f85149; --accent: #4a9eff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --panel2: #f0f2f5; --line: #dfe3e8;
      --fg: #1c2024; --dim: #5b636e; --faint: #868e98;
      --ok: #1a7f37; --warn: #9a6700; --err: #cf222e; --accent: #0969da;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 14px 22px;
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .meta { color: var(--dim); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .meta b { color: var(--fg); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; margin-right: 5px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--err); } .dot.wait { background: var(--warn); }
  main { padding: 18px 22px 60px; max-width: 1180px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint);
       margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
  h2 .n { background: var(--panel2); color: var(--dim); border-radius: 9px; padding: 1px 8px; font-size: 11px; letter-spacing: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 13px 15px; margin-bottom: 10px; }
  .row1 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .title { font-weight: 600; font-size: 15px; }
  .tid { color: var(--faint); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); }
  .pill.queued { color: var(--dim); } .pill.running { color: var(--accent); border-color: var(--accent); }
  .pill.done { color: var(--ok); border-color: var(--ok); }
  .pill.failed { color: var(--err); border-color: var(--err); }
  .pill.cancelled { color: var(--faint); } .pill.waiting_confirmation { color: var(--warn); border-color: var(--warn); }
  .prompt { color: var(--dim); margin: 7px 0 4px; white-space: pre-wrap; word-break: break-word; }
  .prompt.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .bar { height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin: 9px 0 5px; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .bar.done i { background: var(--ok); } .bar.failed i { background: var(--err); }
  .note { color: var(--fg); font-size: 13px; }
  .times { color: var(--faint); font-size: 12px; margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
  .final { margin-top: 9px; padding: 9px 11px; background: var(--panel2); border-radius: 8px;
           white-space: pre-wrap; word-break: break-word; color: var(--fg); }
  .final .lbl { color: var(--faint); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  summary:hover { color: var(--fg); }
  pre { background: var(--panel2); padding: 9px 11px; border-radius: 8px; overflow: auto;
        max-height: 320px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .arts { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
  .art a { color: var(--accent); text-decoration: none; font-size: 13px; }
  .art a:hover { text-decoration: underline; }
  .art .sz { color: var(--faint); font-size: 11px; margin-left: 6px; }
  .err { color: var(--err); margin-top: 7px; white-space: pre-wrap; }
  .acts { margin-top: 9px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 12px; background: var(--panel2); color: var(--dim);
           border: 1px solid var(--line); border-radius: 7px; padding: 4px 11px; cursor: pointer; }
  button:hover { color: var(--fg); border-color: var(--faint); }
  button.danger:hover { color: var(--err); border-color: var(--err); }
  .empty { color: var(--faint); font-size: 13px; padding: 4px 2px 12px; }
  .path { color: var(--faint); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; word-break: break-all; }
  a.ext { color: var(--accent); text-decoration: none; font-size: 12px; }
  a.ext:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>任务队列 <span class="pill">tea_a2</span></h1>
  <div class="meta">
    <span><span class="dot" id="d-agent"></span>agent <b id="m-agent">…</b></span>
    <span>额度 <b id="m-quota">…</b></span>
    <span>排队 <b id="m-q">0</b> · 进行 <b id="m-r">0</b> · 等确认 <b id="m-w">0</b> · 完成 <b id="m-d">0</b> · 失败 <b id="m-f">0</b></span>
    <span>刷新 <b id="m-age">…</b></span>
  </div>
</header>
<main>
  <h2>排队中 <span class="n" id="n-queued">0</span></h2>
  <div id="s-queued"></div>
  <h2>进行中 <span class="n" id="n-running">0</span></h2>
  <div id="s-running"></div>
  <h2>已完成 <span class="n" id="n-done">0</span></h2>
  <div id="s-done"></div>
</main>
<script>
'use strict';
var state = { tasks: [], health: null, at: Date.now() };

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = String(text);
  return n;
}
function ago(iso) {
  if (!iso) return '';
  var t = Date.parse(iso);
  if (isNaN(t)) return iso;
  var s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return Math.round(s) + ' 秒前';
  if (s < 3600) return Math.round(s / 60) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
function when(iso) { return iso ? iso.replace('T', ' ').replace('Z', ' UTC') : ''; }
function bytes(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function card(t) {
  var c = el('div', 'card');
  var r1 = el('div', 'row1');
  r1.appendChild(el('span', 'title', t.title || t.prompt || t.id));
  r1.appendChild(el('span', 'tid', t.id));
  r1.appendChild(el('span', 'pill ' + (t.status || ''), t.status || ''));
  if (t.provider) r1.appendChild(el('span', 'pill', t.provider));
  c.appendChild(r1);

  var p = el('div', 'prompt clamp', t.prompt || '');
  c.appendChild(p);

  var pct = Math.max(0, Math.min(100, t.progress || 0));
  var bar = el('div', 'bar' + (t.status === 'done' ? ' done' : t.status === 'failed' ? ' failed' : ''));
  var fill = el('i'); fill.style.width = pct + '%'; bar.appendChild(fill);
  c.appendChild(bar);
  c.appendChild(el('div', 'note', (t.note || '') + (t.note ? '  ' : '') + '(' + pct + '%)'));

  var times = el('div', 'times');
  times.appendChild(el('span', '', '排队 ' + ago(t.created_at) + '（' + when(t.created_at) + '）'));
  if (t.started_at) times.appendChild(el('span', '', '开始 ' + ago(t.started_at)));
  if (t.finished_at) times.appendChild(el('span', '', '结束 ' + ago(t.finished_at)));
  if (t.session_id) times.appendChild(el('span', '', '会话 ' + t.session_id));
  c.appendChild(times);

  if (t.error) c.appendChild(el('div', 'err', '✗ ' + t.error));

  if (t.result) {
    var f = el('div', 'final');
    f.appendChild(el('div', 'lbl', '最终回答'));
    f.appendChild(document.createTextNode(t.result));
    c.appendChild(f);
  }

  if (t.artifacts && t.artifacts.length) {
    var d = el('details');
    d.appendChild(el('summary', '', '生成物（' + t.artifacts.length + '）'));
    var box = el('div', 'arts');
    t.artifacts.forEach(function (a) {
      var line = el('div', 'art');
      var href = (t.agent_url || '') + '/api/workspaces/' + encodeURIComponent(t.workspace_id || '') +
        '/download?path=' + encodeURIComponent(a.path || '');
      var a2 = el('a', '', a.path || '');
      a2.href = href; a2.target = '_blank';
      line.appendChild(a2);
      if (a.bytes != null) line.appendChild(el('span', 'sz', bytes(a.bytes) + (a.kind ? ' · ' + a.kind : '')));
      box.appendChild(line);
    });
    d.appendChild(box);
    c.appendChild(d);
  }

  if (t.steps && t.steps.length) {
    var ds = el('details');
    ds.appendChild(el('summary', '', '中间状态（' + t.steps.length + '）'));
    var pre = el('pre');
    t.steps.forEach(function (s) {
      pre.appendChild(document.createTextNode('[' + (s.at || '') + '] ' +
        (s.progress != null ? s.progress + '% ' : '') + (s.note || '') + '\n'));
    });
    ds.appendChild(pre);
    c.appendChild(ds);
  }

  var d2 = el('details');
  d2.appendChild(el('summary', '', '任务目录与链接'));
  var box2 = el('div');
  box2.appendChild(el('div', 'path', '记录：' + (t.record_path || '')));
  if (t.workspace_path) box2.appendChild(el('div', 'path', '工作区：' + t.workspace_path));
  if (t.session_id && t.agent_url) {
    var l = el('a', 'ext', '在 agent 里打开这个会话 ↗');
    l.href = t.agent_url + '/?s=' + encodeURIComponent(t.session_id);
    l.target = '_blank';
    box2.appendChild(l);
  }
  d2.appendChild(box2);
  c.appendChild(d2);

  var acts = el('div', 'acts');
  function act(label, path, body, danger) {
    var b = el('button', danger ? 'danger' : '', label);
    b.onclick = function () {
      fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body || {}) })
        .then(function () { refresh(); });
    };
    acts.appendChild(b);
  }
  if (t.status === 'queued') act('开始', '/api/tasks/' + t.id + '/start');
  if (t.status === 'running') act('取消', '/api/tasks/' + t.id + '/cancel');
  if (t.status === 'waiting_confirmation') {
    var ans = el('button', '', '回答…');
    ans.onclick = function () {
      var msg = window.prompt('要回答什么？', '');
      if (!msg) return;
      act('', '/api/tasks/' + t.id + '/confirm', { message: msg });
    };
    acts.appendChild(ans);
  }
  var del = el('button', 'danger', '删除');
  del.onclick = function () {
    if (!window.confirm('删除任务 ' + t.id + '？')) return;
    fetch('/api/tasks/' + t.id + '?workspace_id=' + encodeURIComponent(t.workspace_id || ''),
          { method: 'DELETE' }).then(refresh);
  };
  acts.appendChild(del);
  c.appendChild(acts);
  return c;
}

function render() {
  var groups = { queued: [], running: [], done: [] };
  state.tasks.forEach(function (t) {
    if (t.status === 'queued') groups.queued.push(t);
    else if (t.status === 'running' || t.status === 'waiting_confirmation') groups.running.push(t);
    else groups.done.push(t);
  });
  var ids = ['queued', 'running', 'done'];
  ids.forEach(function (g) {
    var host = document.getElementById('s-' + g);
    host.textContent = '';
    document.getElementById('n-' + g).textContent = groups[g].length;
    if (!groups[g].length) {
      host.appendChild(el('div', 'empty', g === 'queued' ? '（没有排队的任务）' :
        g === 'running' ? '（现在没有在跑的任务）' : '（还没有完成的任务）'));
      return;
    }
    groups[g].forEach(function (t) { host.appendChild(card(t)); });
  });
  var m = { q: 0, r: 0, w: 0, d: 0, f: 0 };
  state.tasks.forEach(function (t) {
    if (t.status === 'queued') m.q++;
    else if (t.status === 'running') m.r++;
    else if (t.status === 'waiting_confirmation') m.w++;
    else if (t.status === 'done') m.d++;
    else if (t.status === 'failed') m.f++;
  });
  document.getElementById('m-q').textContent = m.q;
  document.getElementById('m-r').textContent = m.r;
  document.getElementById('m-w').textContent = m.w;
  document.getElementById('m-d').textContent = m.d;
  document.getElementById('m-f').textContent = m.f;
  document.getElementById('m-age').textContent = Math.round((Date.now() - state.at) / 1000) + ' 秒前';
}

function refresh() {
  return fetch('/api/tasks').then(function (r) { return r.json(); }).then(function (d) {
    state.tasks = d.tasks || [];
    state.at = Date.now();
    render();
  }).catch(function () {});
}

function health() {
  return fetch('/api/health').then(function (r) { return r.json(); }).then(function (h) {
    state.health = h;
    var ok = !!h.agent_ok;
    document.getElementById('d-agent').className = 'dot ' + (ok ? 'ok' : 'bad');
    document.getElementById('m-agent').textContent = (h.agent || '') + (ok ? '' : '（连不上）');
    var c = (h.counts || {});
    document.getElementById('m-quota').textContent = h.quota_percent != null ?
      h.quota_percent + '%' : '—';
  }).catch(function () {
    document.getElementById('d-agent').className = 'dot bad';
  });
}

refresh(); health();
setInterval(refresh, 5000);
setInterval(health, 10000);
// 事件流：有任务变化就重画（比轮询快）
try {
  var es = new EventSource('/api/events');
  es.onmessage = function () { refresh(); };
} catch (e) { /* 没有事件流就靠轮询 */ }
</script>
</body>
</html>
