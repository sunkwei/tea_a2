<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="tea_a2">
  <!-- tea_a2 的图标：一杯茶，杯里是命令提示符（> _）。
       64×64 网格；缩到 16px 也认得出「一只杯子」。
       这个文件是**源**：favicon、Android launcher、Windows .ico 都从它渲染
       （.tea_agent_run/scripts/icon_render.mjs）。 -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F8172"/>
      <stop offset="0.6" stop-color="#13A692"/>
      <stop offset="1" stop-color="#1AC2AC"/>
    </linearGradient>
    <radialGradient id="light" cx="0.25" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#F2E4CB"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角方块自带底色，深色/浅色两种标签栏上都立得住 -->
  <rect x="1" y="1" width="62" height="62" rx="14.5" fill="url(#tile)"/>
  <rect x="1" y="1" width="62" height="62" rx="14.5" fill="url(#light)"/>
  <rect x="1.4" y="1.4" width="61.2" height="61.2" rx="14.1" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="0.8"/>

  <!-- 热气：贴着杯口起，两缕一高一低 -->
  <g stroke="#FFFBF2" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M24.6 21.9c-1.5-2.2 1.5-3.3 0-5.5"/>
    <path d="M33.6 21.9c1.5-2.2-1.5-3.3 0-5.5"/>
  </g>

  <!-- 杯身（带一点点锥度）、把手、杯底的一点阴影 -->
  <ellipse cx="29" cy="45.6" rx="15.6" ry="2.6" fill="#063C34" opacity="0.22"/>
  <path d="M14.6 23.6h28.8l-2.7 15.9a5.6 5.6 0 0 1-5.5 4.7H22.8a5.6 5.6 0 0 1-5.5-4.7z"
        fill="url(#cup)"/>
  <path d="M43.4 27.6c5.4 0 7.9 3.1 7.9 6.4s-2.5 6.4-7.9 6.4"
        stroke="url(#cup)" stroke-width="3.3" stroke-linecap="round" fill="none"/>

  <!-- 杯里的提示符：> _ -->
  <g stroke="#0A5A50" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M24.4 29.3 29.6 33.5 24.4 37.7" stroke-width="2.9"/>
    <path d="M32.2 37.8h4.6" stroke-width="2.6"/>
  </g>
</svg>
