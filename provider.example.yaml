# Example provider configuration for tea_agent.
#
#   copy provider.example.yaml  %USERPROFILE%\.tea_agent\provider.yaml
#
# tea_agent reads $HOME/.tea_agent/provider.yaml (override with --config) and
# speaks the OpenAI chat-completions protocol, so any compatible endpoint works.

version: 1

providers:
  DeepSeek:
    # Bare hosts are fine: tea_agent appends /v1/chat/completions when the URL
    # has no path, and /chat/completions when it ends with /v1.
    api_url: https://api.deepseek.com
    api_key: sk-REPLACE-ME
    default_model: deepseek-chat   # fallback only: the FIRST model in models: wins
    # Provider-scoped web tools. The endpoints (POST /v1/tools/search and
    # /v1/tools/fetch, same Bearer auth) are DeepSeek-specific, not
    # OpenAI-standard, so they are declared instead of probed. When enabled,
    # toolkit_search / toolkit_fetch join the advertised tool set. The provider
    # bills every successful call per request (5 CNY / 1000 calls each), so the
    # default is off.
    #
    # These two flags belong HERE, on the provider - not on a model below. A
    # model-level `supports_search: true` is promoted (with a warning) so an
    # existing file keeps working, but the provider block is the documented place.
    # Note also: 'localization' in a search call is an IP address for geolocation,
    # not a language - use the lang:zh / lang:en query operator for language.
    supports_search: true
    supports_fetch: true
    # Optional endpoint overrides (path relative to api_url, or a full URL):
    # search_path: /v1/tools/search
    # fetch_path: /v1/tools/fetch
    #
    # Token usage in a streaming response is opt-in for most OpenAI-compatible
    # gateways (`stream_options: {include_usage: true}`), and without it there is
    # no usage at all - no prompt/completion tokens, no prefix-cache hit count.
    # tea_a2 asks for it by default (settings.stream_include_usage) and drops the
    # field for a provider that answers 400. Uncomment to decide per provider.
    # stream_include_usage: true
    # Every model can be tuned. The settings page ("模型配置") writes exactly
    # these keys into this block - the other providers, the comments and the
    # settings block stay as they are.
    #
    # A sampling parameter that is NOT in the file is not sent with the
    # request: a gateway that does not know `top_k` answers 400. That is why
    # every one of them is commented out here - "not set" and "set to 0" are
    # different things.
    models:
      deepseek-chat:
        max_context_tokens: 128000     # the context window
        max_output_tokens: 8192         # the output limit of one answer
        supports_tools: true            # may the model call tools?
        supports_reasoning: false       # may the model think?
        supports_vision: false          # may the model look at pictures?
        # How hard it should think: off / minimal / low / medium / high /
        # xhigh / max. `auto` means "do not send the field at all" - the
        # provider then uses its own default. It only reaches the provider
        # when the model says supports_reasoning: true.
        reasoning_effort: auto
        # temperature: 0.7              # 0 - 2
        # top_p: 0.9                    # 0 - 1
        # top_k: 40                     # vLLM / Ollama and friends
        # frequency_penalty: 0          # -2 - 2
        # presence_penalty: 0           # -2 - 2
        # seed: 42
        note: ''
      deepseek-reasoner:
        max_context_tokens: 128000
        max_output_tokens: 65536
        supports_tools: true
        supports_reasoning: true
        reasoning_effort: auto
    api_keys:
      - sk-REPLACE-ME

  # A provider with a QUOTA endpoint - "how much of my subscription is left".
  # Today that is MiniMax M Plan: a 5-hour window plus a weekly window.
  #
  #   GET https://www.minimax.cn/v1/token_plan/remains
  #   Authorization: Bearer <M Plan subscription key>
  #
  # (Documented in the M Plan FAQ, not in the API overview:
  #  https://platform.minimax.cn/docs/m-plan/faq)
  #
  # The endpoint is not OpenAI-standard, so it is declared, not probed. The
  # server queries it with the provider's own key (the browser never sees it)
  # and shows the result as a badge in the top bar.
  #
  # This is NOT the same as `stream_include_usage` above: that one asks for
  # token counts inside a chat response, this one is a separate account
  # endpoint about the remaining subscription quota.
  minimax:
    api_url: https://api.minimax.cn/v1
    api_key: sk-cp-REPLACE-ME       # the M Plan SUBSCRIPTION key (sk-cp-...)
    # Every device that carries this file asks the provider for the quota. On a
    # single machine that is one request now and then; on a fleet of thousands
    # it is thousands of requests from one account, and that pattern is what
    # gets an account flagged. Comment the two lines below out when the file
    # goes to a fleet - the one-key quick setup generates a config with the
    # quota query already switched off.
    supports_usage: true
    usage_type: minimax_token_plan  # which parser understands the answer
    # usage_url: https://www.minimax.cn/v1/token_plan/remains   # optional
    # The page a HUMAN opens to see the quota (the console). It stands on its
    # own: a provider whose quota cannot be queried with a key at all can still
    # point at its dashboard, and the top bar badge becomes "额度 ↗" - click it
    # and the console opens in a new tab (you log in yourself).
    # usage_console_url: https://platform.minimax.cn/console/usage
    # usage_auth: bearer             # bearer (default) | api-key | none
    # usage_headers:                 # extra headers for the usage request only
    #   Cookie: 'session=...'
    # usage_fields:                  # only for usage_type: json_fields
    #   remaining_percent: data.quota.remainingPercent
    #   used: data.quota.used
    #   total: data.quota.total
    #   reset_at_ms: data.quota.resetAt
    #   label: data.quota.name
    models:
      MiniMax-M3.1-Flash:
        max_context_tokens: 1000000
        max_output_tokens: 128000
        supports_tools: true
        supports_reasoning: true
        supports_vision: true

  # Xiaomi MiMo Token Plan: there is NO endpoint that answers with your quota
  # for an API key. The gateway (token-plan-cn.xiaomimimo.com) only speaks the
  # OpenAI-compatible API, and the console's own endpoint
  # (platform.xiaomimimo.com/api/v1/tokenPlan/usage) needs a logged-in Xiaomi
  # account session - an API key gets 401 there. The credits are visible in the
  # console only: https://platform.xiaomimimo.com/#/console/plan-manage
  #
  # So `supports_usage` is deliberately NOT set for it. If you want the console
  # numbers anyway, use the generic form below (the cookie expires, and you
  # have to fill in the field paths yourself):
  #
  # mimo:
  #   api_url: https://token-plan-cn.xiaomimimo.com/v1
  #   api_key: tp-...
  #   supports_usage: true
  #   usage_type: json_fields
  #   usage_url: https://platform.xiaomimimo.com/api/v1/tokenPlan/usage
  #   usage_auth: none
  #   usage_headers:
  #     Cookie: 'session=...'
  #   usage_fields:
  #     remaining_percent: data.remainingPercent
  #
  # ...or just the console link, no API at all:
  # mimo:
  #   api_url: https://token-plan-cn.xiaomimimo.com/v1
  #   api_key: tp-...
  #   usage_console_url: https://platform.xiaomimimo.com/#/console/plan-manage
  #
  # MiMo has TWO gateways and the key says which one it is (they cannot be
  # mixed - a Token Plan key on the pay-as-you-go gateway answers 401):
  #   sk-...            -> pay-as-you-go: https://api.xiaomimimo.com/v1
  #   tp-... / ttp-...  -> Token Plan:    https://token-plan-cn.xiaomimimo.com/v1
  # (Singapore: token-plan-sgp.xiaomimimo.com, Europe: token-plan-ams...)
  #
  # The v2.6 models think by default. In thinking mode the assistant's
  # reasoning_content has to be sent back with the next request, otherwise the
  # provider answers 400 as soon as the history holds a tool call:
  # mimo:
  #   api_url: https://api.xiaomimimo.com/v1
  #   api_key: sk-...
  #   usage_console_url: https://platform.xiaomimimo.com/#/console/usage
  #   reasoning_content: keep
  #   models:
  #     mimo-v2.6-flash:
  #       max_context_tokens: 1000000
  #       max_output_tokens: 128000
  #       supports_tools: true
  #       supports_reasoning: true
  #       supports_vision: true
  #     mimo-v2.6-pro:
  #       max_context_tokens: 1000000
  #       max_output_tokens: 128000
  #       supports_tools: true
  #       supports_reasoning: true
  #       supports_vision: true

  # A local OpenAI-compatible server (llama.cpp, vLLM, Ollama, LM Studio, ...).
  local:
    api_url: http://127.0.0.1:11434/v1
    api_key: not-needed
    default_model: qwen2.5-coder:7b
    models:
      qwen2.5-coder:7b:
        max_context_tokens: 32768
        max_output_tokens: 4096
        supports_tools: true

  # Gateways that need extra routing headers declare them here. ${session_id}
  # is replaced with the current conversation id on every request.
  opencode:
    api_url: https://opencode.ai/zen/go/v1
    api_key: sk-REPLACE-ME
    default_model: deepseek-v4.1-flash
    headers:
      x-opencode-session: '${session_id}'
    # Thinking-mode gateways demand the previous assistant reasoning be echoed
    # back on the follow-up request; DeepSeek rejects/ignores it. `auto` (the
    # default) decides per endpoint and self-corrects on a 400.
    reasoning_content: auto
    models:
      deepseek-v4.1-flash:
        max_context_tokens: 1000000
        max_output_tokens: 384000
        supports_tools: true
        supports_reasoning: true

# There is no default:/roles: block: the default is the FIRST provider in this
# file and the FIRST model in its models: list. Move a provider or a model up to
# change what a new conversation starts with, or pass --provider/--model. A file
# that still carries the legacy `roles:` block gets a warning at startup (roles
# came from the Python implementation and never mapped onto anything here).

# The independent search provider (optional).
#
# The web tools (toolkit_search / toolkit_fetch) are provider-scoped: they only
# appear when the provider the conversation runs on declares them. That couples
# two things that are usually NOT the same account: the chat may run on a cheap
# local model with no web access at all, while the searches are billed to the
# DeepSeek account (5 CNY / 1000 successful calls, each).
#
# The `search:` section names the provider that serves the web tools, no matter
# which provider the conversation runs on:
#
#   search:
#     provider: DeepSeek      # an entry of the `providers:` list above
#
# With that in place a chat on `local` (or any provider without the flags)
# still gets toolkit_search / toolkit_fetch - the requests go to the search
# provider, with the search provider's key.
#
#   * By default the turn's own provider wins when it CAN serve the tool; the
#     search provider is the fallback. `always: true` inverts that: every web
#     call goes to the search provider, even when the chat could have served
#     it (one account, one bill).
#   * `supports_search` / `supports_fetch` are inherited from the named
#     provider; set them in the section to override.
#   * `search_path` / `fetch_path` override the endpoints (path relative to
#     api_url, or a full URL).
#   * A section naming a provider that does not exist, or a provider without an
#     api_key, is reported at startup and the web tools stay switched off.

# Speech-to-text (optional). The microphone button next to the composer
# appears only when this section is present - a button that cannot work is
# worse than no button.
#
# The service speaks the OpenAI transcription API: the agent posts the
# recorded clip to <url>/v1/audio/transcriptions and reads back {"text": "..."}.
# The repository ships a local one that runs SenseVoiceSmall (multilingual,
# good at Chinese, ~240 MB, CPU only):
#
#   pip install sherpa-onnx
#   python3 sched/asr_server.py --download    # fetch the model
#   python3 sched/asr_server.py               # serve on 127.0.0.1:8284
#
#   asr:
#     url: http://127.0.0.1:8284
#     model: sense-voice
#
# Any OpenAI-compatible transcription service works, in the cloud too - then
# add the key:
#
#   asr:
#     url: https://api.example.com
#     model: FunAudioLLM/SenseVoiceSmall
#     api_key: sk-...
#
# Note: browsers only hand out the microphone in a secure context (https or
# localhost). Opening the UI over http://<LAN-IP> therefore shows no
# microphone button - that is the browser's rule, not this program's.

# The settings do NOT live in this file.
#
# provider.yaml says **who to talk to**: the providers, the independent search
# provider (`search:`), the speech-to-text service (`asr:`). How the agent
# works is configured in two other files:
#
#   <tea_home>/tea_agent.yaml                  machine level (all workspaces)
#   <workspace>/.tea_agent_run/settings.yaml   per workspace (wins)
#
# A `settings:` block here is not read any more - it came from the Python
# implementation, where this file was both the provider list and the settings.
# The startup log says so if it finds one. See tea_agent.example.yaml for the
# settings and what each one does.
