# Test provider configuration used by tests/e2e.ps1.
#
# It points at tools/mock_llm_server.mjs, which speaks the OpenAI
# chat-completions protocol over plain http and drives a four-step
# tool-calling conversation:
#
#   turn 0 -> toolkit_exec   (echo mock-tool-exec-ok)
#   turn 1 -> toolkit_file   (write mock_note.txt)
#   turn 2 -> toolkit_file   (read  mock_note.txt)
#   turn 3 -> final assistant message
#
# `mock_nousage` serves the same mock but never reports token usage, which is how
# a gateway that ignores stream_options.include_usage behaves.
#
# Copy this file to $HOME/.tea_agent/provider.yaml (or pass --config) to try the
# agent without a real API key.
version: 1
providers:
  mock:
    api_url: http://127.0.0.1:8790/v1
    api_key: mock-key-not-used
    default_model: mock-model
    description: local mock used by the end-to-end test
    # The mock also answers the M Plan quota endpoint, so the task server (the
    # queue) can be exercised end to end: it asks the agent how much quota is
    # left before it starts a task.
    supports_usage: true
    usage_type: minimax_token_plan
    usage_url: http://127.0.0.1:8790/v1/token_plan/remains
    models:
      mock-model:
        max_context_tokens: 128000
        max_output_tokens: 8192
        supports_vision: false
        supports_reasoning: true
        supports_tools: true
        reasoning_effort: auto
        note: ''
  # Same mock, but with a tiny context window so the history-compaction path can
  # be exercised without a long conversation. Select it per request with
  # {"provider":"mock_small"}.
  mock_small:
    api_url: http://127.0.0.1:8790/v1
    api_key: mock-key-not-used
    default_model: mock-model
    description: tiny context window, used to exercise history compaction
    models:
      mock-model:
        max_context_tokens: 1500
        max_output_tokens: 100
        supports_tools: true
        supports_reasoning: true
    api_keys:
      - mock-key-not-used
  # Same mock, but it never reports usage - real gateways do this when they ignore
  # stream_options.include_usage. Exercises the estimated-metrics fallback.
  mock_nousage:
    api_url: http://127.0.0.1:8790/v1
    api_key: mock-key-not-used
    default_model: mock-no-usage
    description: mock that never reports token usage
    models:
      mock-no-usage:
        max_context_tokens: 64000
        max_output_tokens: 4096
        supports_tools: true
        supports_reasoning: true
roles:
  main:
    provider: mock
    model: mock-model
settings:
  max_iterations: 8
  max_tool_output: 65536
  command_timeout_ms: 30000
  stream: true
